  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct);
  return new TextDecoder().decode(pt);
}
async function go(pw,quiet){
  try{
    if(!window.crypto||!crypto.subtle)throw new Error('nocrypto');
    var html=await open_(pw);
    try{sessionStorage.setItem('ekpw',pw);}catch(e){}
    document.open();document.write(html);document.close();
  }catch(err){
    if(quiet)return;
    document.getElementById('e').textContent=(err&&err.message==='nocrypto')?'Dieser Browser kann die Seite nicht entschlüsseln (bitte über https öffnen).':'Falsches Passwort.';
  }
}
document.getElementById('f').addEventListener('submit',function(ev){ev.preventDefault();go(document.getElementById('p').value,false);});
try{var s=sessionStorage.getItem('ekpw');if(s)go(s,true);}catch(e){}
</script></body></html>
