function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
async function open_(pw){
  var raw=b64(DATA),salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28);
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct);
  return new TextDecoder().decode(pt);
}
async function go(pw,quiet){
  try{
    if(!window.crypto||!crypto.subtle)throw new Error('nocrypto');
    var html=await open_(pw);
    try{sessionStorage.setItem('ekpw',pw);}catch(e){}
    document.open();document.write(html);document.close();
  }catch(err){
    if(quiet)return;
    document.getElementById('e').textContent=(err&&err.message==='nocrypto')?'Dieser Browser kann die Seite nicht entschlüsseln (bitte über https öffnen).':'Falsches Passwort.';
  }
}
document.getElementById('f').addEventListener('submit',function(ev){ev.preventDefault();go(document.getElementById('p').value,false);});
